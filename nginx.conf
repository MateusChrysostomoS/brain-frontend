server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── brain-api, served from THIS origin ─────────────────────────────────
    # Everything under /api/ is reverse-proxied to brain-api, so the browser only
    # ever talks to one origin. That is the whole reason the session's refresh
    # token can be a FIRST-PARTY HttpOnly cookie (`__Host-refresh_token`, see
    # brain-api core/cookies.py): SameSite=Lax works, CORS-with-credentials stops
    # being involved, and — the part that would have bitten hardest — Safari's ITP
    # and Firefox's ETP have no third-party cookie to evict. A cross-origin
    # `SameSite=None` cookie would have broken the silent refresh for a fraction
    # of real users, intermittently, with nothing failing loudly enough to notice.
    #
    # Longest-prefix wins, so this beats the `location /` catch-all below no
    # matter where it sits in the file.
    #
    # NO `add_header` HERE, deliberately — the same block in
    # secretarIA-frontend/nginx.conf inherits a server-level security-header list
    # and one add_header would strip all of it. This file has no such list YET
    # (the header hardening from 2026-08-30 was scoped to secretarIA-frontend and
    # is still pending here), so /api/ responses carry only what brain-api sends.
    # When that hardening lands, this block must stay header-free.
    #
    # KEEP IN SYNC WITH THE Dockerfile: NEXT_PUBLIC_MANAGE_API_BASE_URL is `/api`,
    # so the bundle reaches brain-api only through this location.
    location /api/ {
        # The trailing slash is load-bearing — it strips the prefix, so
        # /api/auth/token arrives at brain-api as /auth/token.
        proxy_pass https://secretaria-brain-api.cpux9k.easypanel.host/;
        proxy_http_version 1.1;

        # $proxy_host, NOT $host. EasyPanel's ingress routes by Host, so sending
        # this frontend's own hostname upstream would land on the wrong service.
        # It is also the name the certificate is verified against below.
        proxy_set_header Host $proxy_host;
        # Without SNI the TLS terminator in front of brain-api cannot tell which
        # vhost is being asked for and answers with the wrong certificate.
        proxy_ssl_server_name on;
        # Needs the ca-certificates package, which the Dockerfile installs into
        # the nginx stage for exactly this line. `proxy_ssl_verify off;` is the
        # one-word rollback if a certificate change ever breaks the hop.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # brain-api rate-limits per client IP and reads the FIRST hop of
        # X-Forwarded-For. Appending (rather than setting) keeps the real client
        # in front; get this wrong and every clinic shares one 10-per-minute auth
        # budget, which looks exactly like a broken login.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # This container listens on plain :80 behind EasyPanel's TLS terminator,
        # so $scheme is "http" and would understate what the browser really did.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Next.js static export (trailingSlash: true) generates folder-style URLs:
    # /login/index.html, /dashboard/index.html, /summary/index.html …
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build assets are safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
